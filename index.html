.tile{height:91px;gap:2px;padding:5px 3px 6px}
.tile .tile-canvas{height:37px}

/* One quiet visual language: physical paper, not an instrument dashboard. */

.goals{gap:7px}.goal .gv{color:#2f473f}

<body>
<div class="shell" id="shell">
<header class="top">
 <div class="identity"><span class="logo" aria-hidden="true"></span><div><strong>PAPER STACK</strong><small>A SMALL WORLD OF PAPER</small></div></div>
 <div class="top-space"></div>
 <button id="stageBtn" class="stagenav" aria-label="ステージを選ぶ"><b id="stageNo">01</b><span id="stageTotal">/ 08</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
 <button class="mini" id="undoBtn" aria-label="一手戻す" title="一手戻す"><svg viewBox="0 0 24 24"><path d="M8 8 3 12l5 4M3 12h11a6 6 0 1 1 0 12" transform="translate(0,-5)"/></svg></button>
 <button class="mini" id="soundBtn" aria-label="音を消す" title="音を消す"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9a5 5 0 0 1 0 6M19 6a9 9 0 0 1 0 12"/></svg></button>
</header>

function between(x,y,r,p=0){return x>=r.left-p&&x<=r.right+p&&y>=r.top-p&&y<=r.bottom+p}
function startDrag(e,i,source){if(drag||modal||e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();SFX.init();const p=getPoint(e.clientX,e.clientY),[w,h]=dim(i);let ax=w/2,ay=h/2;if(source==='board'&&placed[i]){ax=clamp(p.x-placed[i].x,0,w);ay=clamp(p.y-placed[i].y,0,h)}drag={id:e.pointerId,i,source,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,ax,ay,moved:false,drop:null,snap:null,lastSnap:null,seenBoard:source==='board',discard:false,lastEdge:false};selected=i;renderTiles();renderBoard();renderStatus();SFX.play('pick');try{(source==='tray'?tiles:board).setPointerCapture(e.pointerId)}catch{}}
function snapAt(x,y){const d=drag,l=level(),b=board.getBoundingClientRect();if(!d)return null;const py=y-23;if(!between(x,py,b,36))return null;const[w,h]=dim(d.i),p=getPoint(x,py);const rawX=p.x-d.ax,rawY=p.y-d.ay;let xx=Math.round(rawX),yy=Math.round(rawY);if(d.snap){let sx=d.snap.x,sy=d.snap.y;xx=rawX>sx+.61||rawX<sx-.61?Math.round(rawX):sx;yy=rawY>sy+.61||rawY<sy-.61?Math.round(rawY):sy}return{x:clamp(xx,0,l.w-w),y:clamp(yy,0,l.h-h)}}
function updateFloat(){const d=drag;if(!d||!d.moved)return;const[w,h]=dim(d.i);floating.hidden=false;floating.style.background=COLORS[d.i];floating.style.setProperty('--cell',`${cell}px`);floating.style.left=`${d.x-d.ax*cell}px`;floating.style.top=`${d.y-d.ay*cell-23}px`;floating.style.width=`${w*cell}px`;floating.style.height=`${h*cell}px`;floating.classList.toggle('discard',d.discard);arena.classList.toggle('discarding',d.discard);$('coords').textContent=d.drop?`${d.drop.x+1} · ${d.drop.y+1}`:'';feedback.hidden=!d.discard;if(d.discard){feedback.textContent='離して片づける';feedback.style.left=`${clamp(d.x,90,innerWidth-90)}px`;feedback.style.top=`${clamp(d.y-53,28,innerHeight-50)}px`}}
function dragMove(e){const d=drag;if(!d||e.pointerId!==d.id)return;e.preventDefault();d.x=e.clientX;d.y=e.clientY;if(!d.moved){if(Math.hypot(d.x-d.startX,d.y-d.startY)<5)return;d.moved=true}const next=snapAt(d.x,d.y),prev=d.drop;d.drop=next;if(next){d.seenBoard=true;d.discard=false;const key=`${next.x},${next.y}`;if(d.lastSnap!==null&&key!==d.lastSnap){const view=snapView();const isAligned=aligned(view.p,d.i);if(isAligned&&!d.lastEdge)SFX.play('edge');else SFX.play('tick');d.lastEdge=isAligned}d.lastSnap=key;d.snap=next}else{d.lastEdge=false;d.lastSnap=null;d.snap=null;const b=board.getBoundingClientRect(),py=d.y-23;const beyond=Math.max(b.left-d.x,d.x-b.right,b.top-py,py-b.bottom);d.discard=!!placed[d.i]&&d.seenBoard&&beyond>66}if(!prev&&!next||prev&&next&&(prev.x!==next.x||prev.y!==next.y)||!prev&&next||prev&&!next)renderBoard();updateFloat()}
function finishDrag(e,cancel=false){const d=drag;if(!d||e.pointerId!==d.id)return;const was=calc().seen;drag=null;floating.hidden=true;feedback.hidden=true;arena.classList.remove('discarding');$('coords').textContent='';if(cancel){renderAll();return}if(d.moved){if(d.drop){let old=placed[d.i];if(!old||old.x!==d.drop.x||old.y!==d.drop.y){remember();placed[d.i]={...d.drop};if(!old)order=order.filter(v=>v!==d.i).concat(d.i);solved=false;SFX.play('drop');buzz(6)}else SFX.play('tap')}else if(d.discard&&placed[d.i]){remember();placed[d.i]=null;solved=false;SFX.play('remove');buzz(4);toast('紙を片づけた · ↶で戻せます')}else{SFX.play('undo');if(d.source==='tray'&&!placed[d.i])toast('盤面まで運んでみよう')}}else{SFX.play('tap')}persist();renderAll();const now=calc().seen;glowChanges(was,now);if(d.drop&&placed[d.i])settle(d.i)}
function cancelDrag(){if(!drag)return;drag=null;floating.hidden=true;feedback.hidden=true;arena.classList.remove('discarding');$('coords').textContent='';renderAll()}
function boardDown(e){const hit=e.target.closest('[data-piece]');const p=getPoint(e.clientX,e.clientY);if(selected!==null&&placed[selected]){const q=placed[selected],[w,h]=dim(selected);if(p.x>=q.x&&p.x<=q.x+w&&p.y>=q.y&&p.y<=q.y+h){startDrag(e,selected,'board');return}}if(hit){startDrag(e,+hit.dataset.piece,'board');return}if(selected!==null){const [w,h]=dim(selected),l=level(),q=placed[selected];const pos={x:clamp(Math.floor(p.x-w/2+.5),0,l.w-w),y:clamp(Math.floor(p.y-h/2+.5),0,l.h-h)};if(!q||pos.x!==q.x||pos.y!==q.y){const old=calc().seen;remember();placed[selected]=pos;if(!q)order=order.filter(a=>a!==selected).concat(selected);solved=false;persist();renderAll();glowChanges(old,calc().seen);settle(selected);SFX.play('drop')}}}
function moveSelected(dx,dy){if(selected===null||!placed[selected])return;const p=placed[selected],[w,h]=dim(selected),l=level();const x=clamp(p.x+dx,0,l.w-w),y=clamp(p.y+dy,0,l.h-h);if(x===p.x&&y===p.y)return;const a=calc().seen;remember();placed[selected]={x,y};solved=false;persist();renderAll();glowChanges(a,calc().seen);SFX.play('tick')}
function removeSelected(){if(selected===null||!placed[selected])return;const a=calc().seen;remember();placed[selected]=null;solved=false;persist();renderAll();glowChanges(a,calc().seen);SFX.play('remove')}
function header(title){return`<div class="sheethead"><h2>${title}</h2><button class="xclose" data-close aria-label="閉じる">×</button></div>`}
function closeSheet(){modal=null;$('scrim').hidden=true}
function openSheet(kind,data){modal=kind;$('scrim').hidden=false;let out='',l=level(),c=calc();if(kind==='stages'){
 out=header('ステージを選ぶ')+`<p class="sheetintro">考えたい問題を選んでください。達成度より、発見する楽しさを。</p><div class="stage-grid">${LEVELS.map((v,i)=>`<button class="stagebox ${mode==='puzzle'&&i===stage?'on':''} ${completed.has(i)?'done':''}" data-stage="${i}"><b>${String(i+1).padStart(2,'0')}</b><small>${completed.has(i)?'✓ CLEAR':`${v.w}×${v.h}`}</small></button>`).join('')}</div><button class="sheetbtn secondary" data-studio>✧　自由実験室へ</button><p class="studio-note">色紙を自由に動かし、数値を気にせず重なり方を眺めるモードもあります。</p>`;
 }else if(kind==='layers'){
 out=header('紙の重なり順')+`<p class="sheetintro">上にある紙ほど手前に見えます。行をドラッグして上下を交換できます。</p><div id="stackRows" class="stack-rows">${[...order].reverse().map((i,k)=>rowLayer(i,k)).join('')}</div><p class="studio-note">紙を選ぶだけでは順番は変わりません。隠れた紙もトレイから選べます。</p>`;
 }else if(kind==='hint'){
 hintLevel=Math.min(3,hintLevel+1);const s=hintLevel===1?'一番上の紙は、他の色に隠されません。紙の元の面積と、目標面積を比べてみましょう。':hintLevel===2?`この問題では、解答例で一番上になるのは「${NAMES[l.top]}」です。どの場所を覆えば、下の紙の見える面積が変わるでしょうか。`:`この解答例で一番下にあるのは「${NAMES[l.solution.order[0]]}」。下から何枚ずつ重ねればいいか考えてみましょう。`;
 out=header(`ひらめきのヒント ${hintLevel} / 3`)+`<div class="hintcard">${s}</div>`+(hintLevel<3?'<button class="sheetbtn secondary" data-more-hint>もう少しヒントを見る</button>':'<button class="sheetbtn secondary" data-example>解答例を見てみる</button>');
 }else if(kind==='result'||kind==='studio-result'){
 const ok=c.solved,positive=mode==='studio'||ok;out=header(mode==='studio'?'見えている面積':ok?'ぴたり、重なった。':'もう一歩。')+`<p class="sheetintro">${mode==='studio'?'いま盤面で見えている色の面積です。紙を動かすと、この関係が連動して変わります。':ok?'全てのマスが覆われ、各色の見える面積が一致しました。':c.empty?`まだ${c.empty}マスが空いています。外形を先に完成させよう。`:'今の見える面積と目標を比べて、重ね方を考えてみよう。'}</p><div class="analysis-grid">${c.counts.map((n,i)=>`<div class="analysis-item ${mode!=='studio'&&n===l.targets[i]?'good':''}"><div class="row"><span><i class="dot" style="background:${COLORS[i]}"></i>${NAMES[i]}の紙</span><b>${n}</b></div><small>${mode==='studio'?`元の面積 ${dim(i)[0]*dim(i)[1]}`:`目標 ${l.targets[i]} / 元の面積 ${dim(i)[0]*dim(i)[1]}`}</small></div>`).join('')}</div>`;
 if(mode==='puzzle'&&ok){out+='<button class="sheetbtn secondary" data-anatomy>紙をほどいて、面積の秘密を見る</button>'+`<button class="sheetbtn" data-next>${stage===LEVELS.length-1?'ステージ一覧へ':'次のステージへ →'}</button>`}else{out+='<button class="sheetbtn secondary" data-close>盤面に戻る</button>'}
 }else if(kind==='anatomy'){
 const above=[...order].reverse(),i=above[anatomyStep],q=placed[i],[w,h]=dim(i),visible=c.counts[i],total=w*h;const cells=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++){const index=(q.y+y)*l.w+q.x+x;cells.push(`<rect x="${x*18}" y="${y*18}" width="17.2" height="17.2" fill="${c.seen[index]===i?COLORS[i]:'#ecf0e9'}"/>`)}const svgW=w*18,svgH=h*18;
 out=header('重なりをほどく')+`<p class="sheetintro">上の紙から一枚ずつ、見えている部分と隠された部分を比べよう。</p><div class="analysis-layer"><div class="analysis-label">上から ${anatomyStep+1} 枚目 / ${order.length} 枚</div><svg class="layer-visual" viewBox="-3 -3 ${svgW+6} ${svgH+6}" style="max-width:${Math.min(280,svgW+10)}px"><rect x="-1.5" y="-1.5" width="${svgW+3}" height="${svgH+3}" fill="#fff" stroke="${COLORS[i]}" stroke-width="1.5"/>${cells.join('')}</svg><p class="story"><b>${NAMES[i]}の紙</b>は ${w} × ${h} = ${total} マス。<br>他の紙に隠れた ${total-visible} マスを除くと、見えるのは <b>${visible} マス</b>。</p><div class="analysis-bar"><span style="width:${100*visible/total}%;background:${COLORS[i]}"></span><span style="width:${100*(total-visible)/total}%;background:#e1e7de"></span></div></div>`+(anatomyStep<order.length-1?'<button class="sheetbtn" data-anatomy-next>次の紙をほどく →</button>':'<button class="sheetbtn" data-next>次のステージへ →</button>')+'<button class="sheetbtn secondary" data-result>結果にもどる</button>';
 }else if(kind==='help'){
 out=header('このゲームの遊び方')+`<ol class="help-list"><li><b>つまむ</b> — 下の色紙をそのまま盤面へドラッグ。紙がマスに吸い付きます。</li><li><b>重ねる</b> — 置いた紙を直接動かせます。隠れた紙は下のトレイで選んでから操作できます。</li><li><b>片づける</b> — 紙を枠の外へしっかり引き出して離せば削除。誤って消しても左上の↶で戻せます。</li><li><b>回す・重ね直す</b> — 「回転」は90°。「重ね順」は上から見える紙を変更します。</li><li><b>考える</b> — 空白を埋め、指定された見える面積へ。正誤判定までは実際の数値は表示しません。</li></ol><p class="studio-note">パソコンでは選択後に矢印キーで移動、Rで回転、Deleteで片づけることもできます。</p><button class="sheetbtn" data-close>さあ、触ってみる</button>`;
 }else if(kind==='finish'){
 out=header('すべての重なりを、解いた。')+`<div class="hintcard">8つの作品を完成させました。次はもう一度別の置き方を探したり、自由実験室で好きな構図を作ったりしてみてください。</div><button class="sheetbtn" data-studio>自由実験室へ</button><button class="sheetbtn secondary" data-stage="0">もう一度、最初から</button>`;
 }$('sheetContent').innerHTML=out;$('sheet').scrollTop=0}
function rowLayer(i,k){return`<div class="stack-row" data-layer="${i}" data-row="${k}"><span class="stack-grip" aria-hidden="true">⠿</span><i class="stack-mark" style="background:${COLORS[i]}"></i><span class="stack-name">${NAMES[i]}の紙<small>${k===0?'一番上':k===order.length-1?'一番下':`上から ${k+1} 枚目`}</small></span><span class="stack-arr"><button data-layerchange="-1" data-id="${i}" ${k===0?'disabled':''} aria-label="${NAMES[i]}を上へ">↑</button><button data-layerchange="1" data-id="${i}" ${k===order.length-1?'disabled':''} aria-label="${NAMES[i]}を下へ">↓</button></span></div>`}
function showExample(){if(mode!=='puzzle')return;remember();const s=level().solution;order=[...s.order];rotated=s.rects.map((r,i)=>r[2]!==level().dims[i][0]||r[3]!==level().dims[i][1]);placed=s.rects.map(([x,y])=>({x,y}));selected=null;solved=false;persist();closeSheet();renderAll();SFX.play('drop');toast('一つの解答例を並べました')}
function check(){if(mode==='studio'){openSheet('studio-result');SFX.play('tap');return}if(solved){if(stage<LEVELS.length-1)gotoStage(stage+1);else openSheet('finish');return}const c=calc();if(c.solved){solved=true;completed.add(stage);try{localStorage.setItem('ps-v5-completed',JSON.stringify([...completed]))}catch{}persist();SFX.play('win');buzz([7,38,10]);renderStatus()}else SFX.play('error');openSheet('result',c)}
function stackDown(e){if(modal!=='layers'||e.target.closest('button'))return;let row=e.target.closest('[data-layer]');if(!row)return;e.preventDefault();stackDrag={id:e.pointerId,i:+row.dataset.layer,from:+row.dataset.row,to:+row.dataset.row,sy:e.clientY,active:false};try{row.setPointerCapture(e.pointerId)}catch{}}
function stackMove(e){if(!stackDrag||e.pointerId!==stackDrag.id)return;const d=stackDrag;if(!d.active&&Math.abs(e.clientY-d.sy)<5)return;d.active=true;e.preventDefault();const rows=[...$('stackRows').querySelectorAll('[data-row]')];let at=rows.length-1;for(let k=0;k<rows.length;k++){const r=rows[k].getBoundingClientRect();if(e.clientY<r.top+r.height/2){at=k;break}}d.to=at;rows.forEach((row,k)=>{row.classList.toggle('held',k===d.from);row.classList.toggle('target',k===d.to&&d.from!==d.to)})}
function stackUp(e,cancel=false){if(!stackDrag||e.pointerId!==stackDrag.id)return;const d=stackDrag;stackDrag=null;if(cancel){openSheet('layers');return}if(d.active&&d.to!==d.from)swapLayer(d.i,d.to-d.from);else if(!d.active){selected=d.i;closeSheet();renderAll();SFX.play('tap')}else openSheet('layers')}
// Hook up the controls.
tiles.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-tile]');if(t)startDrag(e,+t.dataset.tile,'tray')});
tiles.addEventListener('keydown',e=>{const t=e.target.closest('[data-tile]');if(!t)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();select(+t.dataset.tile)}else if(e.key.toLowerCase()==='r'){e.preventDefault();select(+t.dataset.tile);rotate()}});
board.addEventListener('pointerdown',boardDown);window.addEventListener('pointermove',dragMove,{passive:false});window.addEventListener('pointerup',e=>finishDrag(e));window.addEventListener('pointercancel',e=>finishDrag(e,true));
$('stageBtn').onclick=()=>{openSheet('stages');SFX.play('tap')};$('undoBtn').onclick=undo;$('soundBtn').onclick=toggleSound;$('rotateBtn').onclick=()=>rotate();$('layerBtn').onclick=()=>{openSheet('layers');SFX.play('tap')};$('hintBtn').onclick=()=>{if(mode==='studio')openSheet('help');else openSheet('hint');SFX.play('tap')};$('resetBtn').onclick=restart;$('checkBtn').onclick=check;
$('scrim').addEventListener('click',e=>{if(e.target===$('scrim'))closeSheet()});$('sheetContent').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close'))closeSheet();else if(b.dataset.stage!==undefined)gotoStage(+b.dataset.stage);else if(b.hasAttribute('data-studio'))gotoStudio();else if(b.dataset.layerchange!==undefined)swapLayer(+b.dataset.id,+b.dataset.layerchange);else if(b.hasAttribute('data-more-hint'))openSheet('hint');else if(b.hasAttribute('data-example'))showExample();else if(b.hasAttribute('data-anatomy')){anatomyStep=0;openSheet('anatomy');SFX.play('layer')}else if(b.hasAttribute('data-anatomy-next')){anatomyStep=Math.min(anatomyStep+1,order.length-1);openSheet('anatomy');SFX.play('layer')}else if(b.hasAttribute('data-result'))openSheet('result');else if(b.hasAttribute('data-next')){if(stage<LEVELS.length-1)gotoStage(stage+1);else openSheet('finish')}});
$('sheetContent').addEventListener('pointerdown',stackDown);window.addEventListener('pointermove',stackMove,{passive:false});window.addEventListener('pointerup',e=>stackUp(e));window.addEventListener('pointercancel',e=>stackUp(e,true));
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();cancelDrag();return}if(modal)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}if(e.key.toLowerCase()==='r'){e.preventDefault();rotate();return}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeSelected();return}if(e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();moveSelected(e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0,e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0)}});
new ResizeObserver(()=>{if(!drag)fitBoard()}).observe($('boardWrap'));window.addEventListener('resize',()=>{if(!drag)fitBoard()});
updateSound();if(!hydrate())resetState();renderAll();requestAnimationFrame(fitBoard);
window.__paperStack={toggleSound,get soundOn(){return sound},get state(){return{...rawState(),cell,calculation:calc(),modal,drag:!!drag}},changeStage:gotoStage,studio:gotoStudio,example:showExample,check,select,rotate,undo,reset:restart};
