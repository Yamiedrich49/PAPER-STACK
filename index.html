tray.addEventListener('click',e=>{const tile=e.target.closest('[data-paper]');if(tile&&phase==='ready'&&+tile.dataset.paper>0){active=+tile.dataset.paper;renderTray();renderBoard();soundFx.play('pick')}});
tray.addEventListener('keydown',e=>{const tile=e.target.closest('[data-paper]');if(!tile)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();active=+tile.dataset.paper;renderTray();renderBoard()}else if(phase==='ready'&&active===+tile.dataset.paper&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const l=level(),r=positions[active],x=clamp(r[0]+(e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0),0,l.w-r[2]),y=clamp(r[1]+(e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0),0,l.h-r[3]);if(x!==r[0]||y!==r[1]){positions[active]=[x,y,r[2],r[3]];lastArea=regions().counts;phase=lastArea.every((n,i)=>n===level().target[i])?'won':'tried';if(phase==='won'){complete.add(stage);store()}render()}}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();cancelDrag()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();resetMove()}});
new ResizeObserver(()=>fitBoard()).observe($('boardspace'));setup(stage);
window.__paperStack={get state(){return{stage,phase,positions:clone(positions),areas:regions().counts,target:[...level().target],selected:active}},playLevel:setup,reset:resetMove,solveCurrent(){if(phase!=='ready')return;const s=level().solution,idx=s.paper;positions[idx]=[...s.position];lastArea=regions().counts;phase=lastArea.every((n,i)=>n===level().target[i])?'won':'tried';if(phase==='won'){complete.add(stage);store()}render()},next(){setup(stage+1)}};
</script>
